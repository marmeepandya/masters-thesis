<!DOCTYPE html>
<html>
<head>
<style>
html { background: #1C2833; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1C2833; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-sizing: border-box;
}
.kicker { color: #7C8A99; font-size: 12pt; letter-spacing: 2pt; font-weight: bold; margin: 0 0 6pt 0; text-align: center; }
.bignum { color: #FFFFFF; font-size: 100pt; font-weight: bold; margin: 0; line-height: 1; text-align: center; }
.caption { color: #D5DBDE; font-size: 15pt; margin: 10pt 0 0 0; text-align: center; max-width: 440pt; line-height: 1.4; }
.row { display: flex; margin-top: 36pt; }
.stat { width: 180pt; text-align: center; margin: 0 20pt; }
.stat .n { color: #2E6E9E; font-size: 20pt; font-weight: bold; margin: 0; }
.stat .l { color: #7C8A99; font-size: 10pt; margin: 4pt 0 0 0; line-height: 1.3; }
</style>
</head>
<body>
<p class="kicker">THE HEADLINE NUMBER</p>
<p class="bignum">40.4%</p>
<p class="caption">of the GOI's random company sample is also findable in PDL, matched by domain</p>
<div class="row">
  <div class="stat"><p class="n">121,300</p><p class="l">GOI companies found in PDL</p></div>
  <div class="stat"><p class="n">23.1M</p><p class="l">unique companies in PDL, bigger than GOI's full ~20M</p></div>
  <div class="stat"><p class="n">0.53%</p><p class="l">of PDL matched, expected, the GOI sample is a tiny slice of PDL's size</p></div>
</div>
</body>
</html>
